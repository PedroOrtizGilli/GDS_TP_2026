<div
  class="modal d-block"
  role="dialog"
  aria-modal="true"
  aria-labelledby="confirmar-titulo"
  data-testid="modal-confirmar"
  (click)="cancelar.emit()"
>
  <div class="modal-dialog" (click)="$event.stopPropagation()">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5" id="confirmar-titulo">Confirmar eliminación</h2>
        <button
          type="button"
          class="btn-close"
          aria-label="Cerrar"
          (click)="cancelar.emit()"
        ></button>
      </div>
      <div class="modal-body">
        <p class="mb-0">¿Seguro que querés eliminar esta venta? Esta acción no se puede deshacer.</p>
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-outline-secondary"
          data-testid="btn-cancelar-eliminar"
          (click)="cancelar.emit()"
        >
          Cancelar
        </button>
        <button
          type="button"
          class="btn btn-danger"
          data-testid="btn-confirmar-eliminar"
          (click)="confirmar.emit()"
        >
          Eliminar
        </button>
      </div>
    </div>
  </div>
</div>
